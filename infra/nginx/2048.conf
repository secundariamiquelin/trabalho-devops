# nginx site for the 2048 app. Installed by infra/server-setup.sh as
# /etc/nginx/sites-available/2048 and enabled as the only site.
#
# The document root is a symlink (current -> releases/<sha>) switched atomically
# by infra/activate-release.sh, so a deploy never serves a half-copied release.

# index.html and version.txt change on every deploy and must not be cached;
# the other assets can be cached for an hour.
map $uri $app_expires {
    ~^/(index\.html|version\.txt)?$  -1;
    default                         1h;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/2048/current;
    index index.html;

    server_tokens off;
    expires $app_expires;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # Never serve dotfiles (.git, .env, editor leftovers).
    location ~ /\. {
        deny all;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
